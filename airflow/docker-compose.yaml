# Local Airflow 3.x (LocalExecutor) on Docker.
# Modified for Databricks & AI Hybrid Architecture by the Senior 🚀
x-airflow-common: &airflow-common
  build: .
  env_file:
    - ../.env   # 🟢 التعديل الأهم: قراءة كل المتغيرات من الفولدر الرئيسي بأمان بدون تكرار الملف
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__API_AUTH__JWT_SECRET: 'change-me-please-a-random-secret'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://apiserver:8080/execution/'
    
    # 🔴 تم حذف DATABRICKS_HOST وباقي المتغيرات من هنا لأن env_file سيقوم بحقنها جميعاً 
    # بشكل مباشر داخل بيئة Airflow تلقائياً (بما فيها OPENAI_API_KEY).
    
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../zomato_dbt:/opt/airflow/dbt/zomato      # ربط فولدر dbt بتاعنا (تأكد إن اسمه صح)
    - ../metadata:/opt/airflow/metadata          # marker اللي بيقرأه الـ query cache (last_ai_run.txt)
    - ../ai:/opt/airflow/ai                     # فولدر الذكاء الاصطناعي للمرحلة التانية
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com
    depends_on:
      postgres:
        condition: service_healthy

  apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata: